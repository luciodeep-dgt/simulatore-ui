<p-table #table [columns]="cols" [value]="subcategories.items">
  <ng-template pTemplate="header" let-columns>
    <tr>
      <th></th>
      <th colspan="6">
        {{ 'SIMULATION.SUBCATEGORIES.SOTTOCATEGORIE_TABLE_HEADER' | translate }}
      </th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-subcategory let-columns="columns">
    <tr>
      <td style="text-align: center">
        <p-checkbox name="groupname" binary="true" [disabled]="isDisabled(subcategory)" [value]="subcategory" [ngModel]="subcategory.checked" (onChange)="onSelectSubcategory(subcategory, $event)">
        </p-checkbox>
      </td>
      <td colspan="6" style="padding: 20px">
        {{ subcategory.descrizione }}
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage" let-columns>
    <tr>
      <td [attr.colspan]="7" class="text-center">
        <p>{{ 'SIMULATION.SUBCATEGORIES.NOT_FOUND' | translate }}</p>
      </td>
    </tr>
  </ng-template>
</p-table>
<p-paginator [rows]="subcategories.limit" [totalRecords]="subcategories.totalCount" 
  [first]="subcategories.offset * subcategories.limit" (onPageChange)="paginate($event)"></p-paginator>
